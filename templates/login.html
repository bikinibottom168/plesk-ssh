{% extends "base.html" %}
{% block bare %}
<div class="min-h-screen flex items-center justify-center bg-slate-900">
  <form method="post" action="/login" class="w-80 bg-slate-800 p-6 rounded-lg shadow-xl border border-slate-700">
    <h1 class="text-xl font-semibold mb-1">Plesk Dashboard</h1>
    <p class="text-xs text-slate-400 mb-4">เข้าสู่ระบบ</p>
    {% if error %}
    <div class="mb-3 px-3 py-2 bg-rose-900/40 border border-rose-700/40 text-rose-200 text-sm rounded">{{ error }}</div>
    {% endif %}
    <label class="block text-xs text-slate-400 mb-1">ชื่อผู้ใช้</label>
    <input name="username" required autofocus class="w-full mb-3 px-3 py-2 bg-slate-900 border border-slate-700 rounded text-sm focus:outline-none focus:border-blue-500">
    <label class="block text-xs text-slate-400 mb-1">รหัสผ่าน</label>
    <input name="password" type="password" required class="w-full mb-4 px-3 py-2 bg-slate-900 border border-slate-700 rounded text-sm focus:outline-none focus:border-blue-500">
    <button class="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium">เข้าสู่ระบบ</button>
  </form>
</div>
{% endblock %}
